apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres
spec:
  instances: 1
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: b2-backup-store
  postgresql:
    extensions:
      - name: pgvector
        image:
          reference: ghcr.io/cloudnative-pg/pgvector:0.8.2-202604291250-18-trixie
      # GeoDjango backend for AdventureLog. ld_library_path/env are required by
      # the CNPG PostGIS extension image so it can find its own shared
      # libraries and the GDAL/PROJ data files.
      - name: postgis
        image:
          reference: ghcr.io/cloudnative-pg/postgis-extension:3.6.4-202608241541-18-trixie
        ld_library_path:
          - system
        env:
          - name: GDAL_DATA
            value: ${image_root}/share/gdal
          - name: PROJ_DATA
            value: ${image_root}/share/proj
  storage:
    size: 10Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      memory: 1Gi
  priorityClassName: platform
  managed:
    roles:
      - name: authentik
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: authentik-db-credentials
      - name: vaultwarden
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: vaultwarden-db-credentials
      - name: immich
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: immich-db-credentials
      - name: adventurelog
        ensure: present
        login: true
        superuser: false
        createdb: false
        passwordSecret:
          name: adventurelog-db-credentials

apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: authentik-db
spec:
  name: authentik
  owner: authentik
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: vaultwarden-db
spec:
  name: vaultwarden
  owner: vaultwarden
  cluster:
    name: postgres
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: immich-db
spec:
  name: immich
  owner: immich
  cluster:
    name: postgres
  extensions:
    - name: cube
      ensure: present
    - name: earthdistance
      ensure: present
    - name: vector
      ensure: present
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: adventurelog-db
spec:
  name: adventurelog
  owner: adventurelog
  cluster:
    name: postgres
  extensions:
    # AdventureLog's Django migrations assume PostGIS already exists — nothing
    # in the app issues CREATE EXTENSION, so CNPG must install it here.
    - name: postgis
      ensure: present

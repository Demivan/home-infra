apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: authentik
  namespace: identity
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Authentik
    gethomepage.dev/description: SSO
    gethomepage.dev/group: Platform
    gethomepage.dev/weight: "10"
    gethomepage.dev/icon: sh-authentik.svg
    gethomepage.dev/pod-selector: app.kubernetes.io/name=authentik
    gethomepage.dev/siteMonitor: http://authentik-server.identity.svc/-/health/live/
    gethomepage.dev/widget.type: authentik
    gethomepage.dev/widget.url: http://authentik-server.identity.svc
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}"
    gethomepage.dev/widget.version: "2"
spec:
  parentRefs:
    - name: internal
      namespace: cilium-gateway
  hostnames:
    - auth.home.demivan.me
  rules:
    - backendRefs:
        - name: authentik-server
          port: 80

apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-homepage
  namespace: identity
data:
  homepage.yaml: |
    version: 1
    metadata:
      name: homepage
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          scope_name: email
          managed: goauthentik.io/providers/oauth2/scope-email-custom
        attrs:
          name: "Email (verified)"
          scope_name: email
          expression: |
            return {
                "email": request.user.email,
                "email_verified": True,
            }
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Homepage
        attrs:
          name: Homepage
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Must be listed explicitly: the model default is an empty list,
          # which permits no grant at all.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env HOMEPAGE_OIDC_CLIENT_ID
          client_secret: !Env HOMEPAGE_OIDC_CLIENT_SECRET
          redirect_uris:
            - url: "https://home.demivan.me/api/auth/callback/homepage-oidc"
              matching_mode: strict
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email-custom]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: homepage
        attrs:
          name: Homepage
          slug: homepage
          policy_engine_mode: any
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Homepage]]
          meta_launch_url: "https://home.demivan.me"
      # Read-only identity behind the Authentik card on Homepage.
      - model: authentik_rbac.role
        id: homepage-widget-role
        state: present
        identifiers:
          name: homepage-widget
        attrs:
          name: homepage-widget
          permissions:
            - authentik_core.view_user
            - authentik_events.view_event
      - model: authentik_core.user
        id: homepage-widget-user
        state: present
        identifiers:
          username: homepage-widget
        attrs:
          username: homepage-widget
          name: Homepage widget
          type: service_account
          path: goauthentik.io/service-accounts
          roles:
            - !KeyOf homepage-widget-role
      - model: authentik_core.token
        state: present
        identifiers:
          identifier: homepage-widget
        attrs:
          intent: api
          expiring: false
          user: !KeyOf homepage-widget-user
          key: !Env HOMEPAGE_WIDGET_TOKEN

apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-mealie
  namespace: identity
data:
  mealie.yaml: |
    version: 1
    metadata:
      name: mealie-oidc
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          scope_name: email
          managed: goauthentik.io/providers/oauth2/scope-email-custom
        attrs:
          name: "Email (verified)"
          scope_name: email
          expression: |
            return {
                "email": request.user.email,
                "email_verified": True,
            }
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: Mealie
        attrs:
          name: Mealie
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Must be listed explicitly: the model default is an empty list,
          # which permits no grant at all.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env MEALIE_OIDC_CLIENT_ID
          client_secret: !Env MEALIE_OIDC_CLIENT_SECRET
          redirect_uris:
            # Mealie returns to /login, with `?direct=1` when auto-redirect is
            # bypassed.
            - url: "^https://recipes\\.home\\.demivan\\.me/login(\\?.*)?$"
              matching_mode: regex
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email-custom]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: mealie
        attrs:
          name: Mealie
          slug: mealie
          policy_engine_mode: any
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, Mealie]]
          meta_launch_url: "https://recipes.home.demivan.me"

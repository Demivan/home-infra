apiVersion: v1
kind: ConfigMap
metadata:
  name: blueprint-adventurelog
  namespace: identity
data:
  adventurelog.yaml: |
    version: 1
    metadata:
      name: adventurelog-oidc
      labels:
        blueprints.goauthentik.io/instantiate: "true"
    entries:
      - model: authentik_providers_oauth2.scopemapping
        state: present
        identifiers:
          scope_name: email
          managed: goauthentik.io/providers/oauth2/scope-email-custom
        attrs:
          name: "Email (verified)"
          scope_name: email
          expression: |
            return {
                "email": request.user.email,
                "email_verified": True,
            }
      - model: authentik_providers_oauth2.oauth2provider
        state: present
        identifiers:
          name: AdventureLog
        attrs:
          name: AdventureLog
          authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
          invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
          client_type: confidential
          # Must be listed explicitly: the model default is an empty list,
          # which permits no grant at all.
          grant_types:
            - authorization_code
            - refresh_token
          client_id: !Env ADVENTURELOG_OIDC_CLIENT_ID
          client_secret: !Env ADVENTURELOG_OIDC_CLIENT_SECRET
          redirect_uris:
            # django-allauth builds the callback as
            # /accounts/oidc/<provider-id>/login/callback/, and the provider id
            # is only chosen later in the Django admin, so match the prefix.
            - url: "^https://trips\\.home\\.demivan\\.me/accounts/oidc/.*$"
              matching_mode: regex
          property_mappings:
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, openid]]
            - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email-custom]]
            - !Find [authentik_providers_oauth2.scopemapping, [scope_name, profile]]
          signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      - model: authentik_core.application
        state: present
        identifiers:
          slug: adventurelog
        attrs:
          name: AdventureLog
          slug: adventurelog
          policy_engine_mode: any
          provider: !Find [authentik_providers_oauth2.oauth2provider, [name, AdventureLog]]
          meta_launch_url: "https://trips.home.demivan.me"

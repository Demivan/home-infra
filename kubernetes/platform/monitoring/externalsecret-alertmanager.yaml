apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: alertmanager-telegram
    template:
      engineVersion: v2
      data:
        alertmanager.yaml: |
          route:
            receiver: telegram
            group_by: ["alertname", "namespace"]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 4h
            routes:
              # Watchdog always fires (pipeline heartbeat); InfoInhibitor fires
              # only to drive the inhibit rule below. Neither is notifiable.
              - receiver: "null"
                matchers:
                  - alertname =~ "Watchdog|InfoInhibitor"
          inhibit_rules:
            # Info alerts are only meaningful next to a real alert in the same
            # namespace. InfoInhibitor fires exactly while that is not the case.
            - source_matchers:
                - alertname = "InfoInhibitor"
              target_matchers:
                - severity = "info"
              equal: ["namespace"]
            - source_matchers:
                - severity = "critical"
              target_matchers:
                - severity =~ "warning|info"
              equal: ["namespace", "alertname"]
            - source_matchers:
                - severity = "warning"
              target_matchers:
                - severity = "info"
              equal: ["namespace", "alertname"]
          receivers:
            - name: "null"
            - name: telegram
              telegram_configs:
                - bot_token: "{{ .bot_token }}"
                  chat_id: {{ .chat_id }}
                  send_resolved: true
                  parse_mode: HTML
                  message: |-
                    {{`{{ if eq .Status "firing" }}`}}🔴{{`{{ else }}`}}🟢{{`{{ end }}`}} <b>{{`{{ .Status | toUpper }}`}}</b> · <i>{{`{{ or .CommonLabels.severity "none" }}`}}</i>
                    <b>{{`{{ .CommonLabels.alertname }}`}}</b>
                    {{`{{ range .Alerts }}`}}
                    {{`{{ .Annotations.summary }}`}}
                    {{`{{ end }}`}}
  data:
    - secretKey: bot_token
      remoteRef:
        key: telegram-bot-token
    - secretKey: chat_id
      remoteRef:
        key: telegram-chat-id

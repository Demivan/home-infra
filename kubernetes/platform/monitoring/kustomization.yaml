apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  # Prometheus Operator CRDs (ServiceMonitor, PodMonitor, PrometheusRule)
  # VM Operator auto-converts these to VM-native CRDs
  - name: prometheus-operator-crds
    repo: https://prometheus-community.github.io/helm-charts
    version: "31.0.1"
    releaseName: prometheus-operator-crds
    namespace: monitoring
    includeCRDs: true

  - name: victoria-metrics-k8s-stack
    repo: https://victoriametrics.github.io/helm-charts/
    version: "0.91.2"
    releaseName: victoria-metrics-k8s-stack
    namespace: monitoring
    includeCRDs: true
    valuesInline:
      # --- VMSingle (metrics storage) ---
      vmsingle:
        enabled: true
        spec:
          retentionPeriod: "90d"
          # Exclude the metrics PVC from K8up backups — VM data is regenerable (re-scraped).
          storageMetadata:
            annotations:
              k8up.io/backup: "false"
          storage:
            storageClassName: local-path
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              memory: 1536Mi
          priorityClassName: platform

      # --- VMAgent (scraping) ---
      vmagent:
        enabled: true
        spec:
          scrapeInterval: 30s
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 512Mi
          priorityClassName: platform

      # --- VMAlert (alerting rules) ---
      vmalert:
        enabled: true
        spec:
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          priorityClassName: platform

      # --- VM Operator (webhook certs via cert-manager) ---
      victoria-metrics-operator:
        admissionWebhooks:
          certManager:
            enabled: true

      # --- Alertmanager (Telegram notifications) ---
      alertmanager:
        enabled: true
        spec:
          configSecret: alertmanager-telegram
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          priorityClassName: platform

      # --- Default alerting/recording rules ---
      defaultRules:
        create: true
        # Keys must match the upstream rule group names exactly.
        # kube-proxy has no rule group in this chart; only its scrape target is disabled below.
        groups:
          etcd:
            enabled: false
          kubernetes-system-controller-manager:
            enabled: false
          kubernetes-system-scheduler:
            enabled: false
          kube-scheduler.rules:
            enabled: false

      # --- Scrape targets ---
      kubelet:
        enabled: true
      kubeApiServer:
        enabled: true
      kubeControllerManager:
        enabled: false
      kubeScheduler:
        enabled: false
      kubeProxy:
        enabled: false
      kubeEtcd:
        enabled: false
      coreDns:
        enabled: true

      # --- Grafana (bundled) ---
      grafana:
        enabled: true
        priorityClassName: platform
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 256Mi
        envFromSecrets:
          - name: grafana-oidc
            optional: false
        grafana.ini:
          server:
            root_url: https://grafana.home.demivan.me
          auth:
            disable_login_form: true
          auth.generic_oauth:
            enabled: true
            name: Authentik
            allow_sign_up: true
            client_id: $__env{client_id}
            client_secret: $__env{client_secret}
            scopes: openid profile email offline_access
            auth_url: https://auth.home.demivan.me/application/o/authorize/
            token_url: https://auth.home.demivan.me/application/o/token/
            api_url: https://auth.home.demivan.me/application/o/userinfo/
            role_attribute_path: "contains(groups[*], 'admin') && 'Admin' || 'Viewer'"
            use_refresh_token: true

# The chart ships its rules/dashboards sync job as a Helm hook. Argo CD only
# translates helm.sh/hook for Helm sources, so under Kustomize the Job is
# silently dropped and no default VMRules are ever created. Re-express it as a
# native Argo hook so it runs on every sync.
patches:
  - target:
      kind: Job
      name: victoria-metrics-k8s-stack-sync-job
    patch: |-
      - op: remove
        path: /metadata/annotations/helm.sh~1hook
      - op: remove
        path: /metadata/annotations/helm.sh~1hook-delete-policy
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook
        value: PostSync
      - op: add
        path: /metadata/annotations/argocd.argoproj.io~1hook-delete-policy
        value: BeforeHookCreation

resources:
  - namespace.yaml
  - externalsecret.yaml
  - externalsecret-alertmanager.yaml
  - httproute.yaml
  - vmrule-backup.yaml

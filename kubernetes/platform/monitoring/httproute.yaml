apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Grafana
    gethomepage.dev/description: Metrics
    gethomepage.dev/group: Platform
    gethomepage.dev/weight: "20"
    gethomepage.dev/icon: sh-grafana.svg
    gethomepage.dev/pod-selector: app.kubernetes.io/name=grafana
    gethomepage.dev/siteMonitor: http://victoria-metrics-k8s-stack-grafana.monitoring.svc/api/health
spec:
  parentRefs:
    - name: internal
      namespace: cilium-gateway
  hostnames:
    - grafana.home.demivan.me
  rules:
    - backendRefs:
        - name: victoria-metrics-k8s-stack-grafana
          port: 80

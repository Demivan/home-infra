# Requires the SMB subdir `music/library` to already exist on the Storage Box.
# Created once (manually) — see docs/superpowers/plans (Task 2). Shared with the
# lidarr namespace (each namespace has its own PV pointing at the same path).
apiVersion: v1
kind: PersistentVolume
metadata:
  name: navidrome-library
spec:
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  mountOptions:
    - vers=3.0
    - file_mode=0644
    - dir_mode=0755
    - uid=0
    - gid=0
    - noperm
    - noserverino
    - cache=strict
    - actimeo=30
  csi:
    driver: smb.csi.k8s.io
    readOnly: false
    volumeHandle: navidrome-library
    volumeAttributes:
      source: "//u569043.your-storagebox.de/backup"
      subDir: "music/library"
    nodeStageSecretRef:
      name: smb-credentials
      namespace: csi-driver-smb

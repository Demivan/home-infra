apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: minecraft
    repo: https://itzg.github.io/minecraft-server-charts/
    version: "5.1.2"
    releaseName: minecraft
    namespace: minecraft
    valuesInline:
      workloadAsStatefulSet: true
      strategyType: OnDelete
      image:
        tag: java25
      minecraftServer:
        eula: "TRUE"
        type: GTNH
        memory: 8G
        jvmOpts: >-
          -Dfml.readTimeout=180
          -Dfml.queryResult=confirm
          -Dfile.encoding=UTF-8
        viewDistance: 12
        maxTickTime: 300000
        spawnProtection: 0
        whitelist: "Demivan"
        rcon:
          enabled: true
          withGeneratedPassword: true
        serviceType: ClusterIP
      serviceAnnotations:
        mc-router.itzg.me/externalServerName: minecraft
        mc-router.itzg.me/autoScaleUp: "true"
        mc-router.itzg.me/autoScaleDown: "true"
        mc-router.itzg.me/autoScaleAsleepMOTD: "Server is sleeping. Join to wake it up!"
        mc-router.itzg.me/autoScaleLoadingMOTD: "Server is starting... please wait (~3 min)"
        mc-router.itzg.me/autoScaleWaitTimeout: "300s"
      extraEnv:
        GTNH_PACK_VERSION: "2.8.4"
        INIT_MEMORY: "8G"
        EXEC_DIRECTLY: "true"
        STOP_SERVER_ANNOUNCE_DELAY: "30"
      startupProbe:
        enabled: true
        failureThreshold: 120
        periodSeconds: 10
      livenessProbe:
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 12
      readinessProbe:
        initialDelaySeconds: 0
        periodSeconds: 10
        failureThreshold: 12
      extraPodSpec:
        priorityClassName: best-effort
      extraVolumes:
        - volumeMounts:
            - name: server-config
              mountPath: /data/local/serverutilities
          volumes:
            - name: server-config
              configMap:
                name: minecraft-serverutilities
      persistence:
        storageClass: local-path
        dataDir:
          enabled: true
          Size: 20Gi
          existingClaim: minecraft-datadir
      resources:
        requests:
          cpu: "2"
          memory: 4Gi

  - name: mc-router
    repo: https://itzg.github.io/minecraft-server-charts/
    version: "1.4.1"
    releaseName: mc-router
    namespace: minecraft
    valuesInline:
      image:
        tag: "1.42.0"
      minecraftRouter:
        autoScale:
          up:
            enabled: true
          down:
            enabled: true
            after: "10m"
      services:
        minecraft:
          type: LoadBalancer
          port: 25565
          annotations:
            tailscale.com/hostname: minecraft
        extraServiceSpec:
          loadBalancerClass: tailscale
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          memory: 64Mi
      extraPodSpec:
        priorityClassName: platform

resources:
  - namespace.yaml
  - datadir-pvc.yaml
  - serverutilities-config.yaml
  - schedule.yaml

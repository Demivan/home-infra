apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: immich
  namespace: immich
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Immich
    gethomepage.dev/description: Photos
    gethomepage.dev/group: Apps
    gethomepage.dev/weight: "10"
    gethomepage.dev/icon: sh-immich.svg
    gethomepage.dev/pod-selector: app.kubernetes.io/instance=immich
    gethomepage.dev/siteMonitor: http://immich-server.immich.svc:2283/api/server/ping
spec:
  parentRefs:
    - name: internal
      namespace: cilium-gateway
  hostnames:
    - photos.home.demivan.me
  rules:
    - backendRefs:
        - name: immich-server
          port: 2283

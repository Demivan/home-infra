apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: immich
    repo: oci://ghcr.io/immich-app/immich-charts
    version: "0.13.1"
    releaseName: immich
    namespace: immich
    valuesInline:
      controllers:
        main:
          containers:
            main:
              image:
                # renovate: datasource=docker depName=ghcr.io/immich-app/immich-server
                tag: v3.1.0
              env:
                DB_HOSTNAME: postgres-rw.postgres.svc
                DB_DATABASE_NAME: immich
                DB_USERNAME: immich
                DB_PASSWORD:
                  valueFrom:
                    secretKeyRef:
                      name: immich-db-credentials
                      key: password
                DB_VECTOR_EXTENSION: pgvector

      immich:
        persistence:
          library:
            existingClaim: immich-library
        existingConfiguration: immich-config
        configurationKind: Secret

      valkey:
        enabled: true

      server:
        enabled: true
        controllers:
          main:
            containers:
              main:
                # The v3 server idles near 1Gi (plugin runtime, workflows,
                # OpenTelemetry), so 1Gi limits OOM-kill it on startup.
                resources:
                  requests:
                    cpu: 100m
                    memory: 1Gi
                  limits:
                    memory: 2Gi

      machine-learning:
        enabled: true
        controllers:
          main:
            containers:
              main:
                resources:
                  requests:
                    cpu: 200m
                    memory: 1Gi
                  limits:
                    cpu: 1000m
                    memory: 2Gi
        persistence:
          cache:
            enabled: true
            size: 10Gi
            type: persistentVolumeClaim
            accessMode: ReadWriteOnce
            storageClass: local-path

resources:
  - namespace.yaml
  - externalsecret.yaml
  - pvc-library.yaml
  - httproute.yaml

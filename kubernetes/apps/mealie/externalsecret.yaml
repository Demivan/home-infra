apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mealie-secrets
  namespace: mealie
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: mealie-secrets
  data:
    - secretKey: db-password
      remoteRef:
        key: mealie-db-password
    - secretKey: oidc-client-id
      remoteRef:
        key: mealie-oidc-client-id
    - secretKey: oidc-client-secret
      remoteRef:
        key: mealie-oidc-client-secret

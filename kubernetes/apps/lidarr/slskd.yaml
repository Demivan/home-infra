apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-config
  namespace: lidarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  namespace: lidarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: slskd
  template:
    metadata:
      labels:
        app: slskd
    spec:
      priorityClassName: app-default
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      initContainers:
        # slskd validates that SLSKD_INCOMPLETE_DIR exists and won't create it;
        # the downloads volume is empty on first mount, so create the subdir.
        - name: init-downloads
          image: busybox:1.37
          command: ["sh", "-c", "mkdir -p /downloads/incomplete"]
          volumeMounts:
            - name: downloads
              mountPath: /downloads
      containers:
        - name: slskd
          # renovate: datasource=docker depName=slskd/slskd
          image: slskd/slskd:0.25.1
          ports:
            - name: http
              containerPort: 5030
            # Soulseek P2P listen port — exposed via a NodePort Service (30300)
            # so NAT'd peers can connect back; required for browse/download.
            # In the NodePort range so the Service nodePort == the advertised port.
            - name: soulseek
              containerPort: 30300
              protocol: TCP
          env:
            - name: SLSKD_SLSK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: soulseek-username
            - name: SLSKD_SLSK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: soulseek-password
            - name: SLSKD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: web-username
            - name: SLSKD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: web-password
            - name: SLSKD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: api-key
            - name: SLSKD_DOWNLOADS_DIR
              value: /downloads
            - name: SLSKD_INCOMPLETE_DIR
              value: /downloads/incomplete
            - name: SLSKD_SHARED_DIR
              value: /music
            # Listen on a NodePort-range port so the NodePort Service can map
            # nodePort == this port == the port slskd advertises to peers.
            - name: SLSKD_SLSK_LISTEN_PORT
              value: "30300"
          volumeMounts:
            - name: config
              mountPath: /app
            - name: downloads
              mountPath: /downloads
            - name: library
              mountPath: /music
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: slskd-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
        - name: library
          persistentVolumeClaim:
            claimName: library
---
apiVersion: v1
kind: Service
metadata:
  name: slskd
  namespace: lidarr
spec:
  selector:
    app: slskd
  ports:
    - name: http
      port: 5030
      targetPort: http
---
# NodePort exposing slskd's Soulseek listen port on the node so peers can
# connect back. nodePort == targetPort == advertised listen port (30300),
# and the Hetzner firewall allows TCP 30300.
apiVersion: v1
kind: Service
metadata:
  name: slskd-soulseek
  namespace: lidarr
spec:
  type: NodePort
  selector:
    app: slskd
  ports:
    - name: soulseek
      port: 30300
      targetPort: soulseek
      nodePort: 30300
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slskd
  namespace: lidarr
spec:
  parentRefs:
    - name: internal
      namespace: cilium-gateway
  hostnames:
    - slsk.home.demivan.me
  rules:
    - backendRefs:
        - name: slskd
          port: 5030

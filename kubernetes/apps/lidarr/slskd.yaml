apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: slskd-config
  namespace: lidarr
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slskd
  namespace: lidarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: slskd
  template:
    metadata:
      labels:
        app: slskd
    spec:
      priorityClassName: app-default
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: slskd
          # renovate: datasource=docker depName=slskd/slskd
          image: slskd/slskd:0.25.1
          ports:
            - name: http
              containerPort: 5030
          env:
            - name: SLSKD_SLSK_USERNAME
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: soulseek-username
            - name: SLSKD_SLSK_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: soulseek-password
            - name: SLSKD_USERNAME
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: web-username
            - name: SLSKD_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: web-password
            - name: SLSKD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: slskd-secrets
                  key: api-key
            - name: SLSKD_DOWNLOADS_DIR
              value: /downloads
            - name: SLSKD_INCOMPLETE_DIR
              value: /downloads/incomplete
            - name: SLSKD_SHARED_DIR
              value: /music
          volumeMounts:
            - name: config
              mountPath: /app
            - name: downloads
              mountPath: /downloads
            - name: library
              mountPath: /music
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: slskd-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
        - name: library
          persistentVolumeClaim:
            claimName: library
---
apiVersion: v1
kind: Service
metadata:
  name: slskd
  namespace: lidarr
spec:
  selector:
    app: slskd
  ports:
    - name: http
      port: 5030
      targetPort: http
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: slskd
  namespace: lidarr
spec:
  parentRefs:
    - name: internal
      namespace: cilium-gateway
  hostnames:
    - slsk.home.demivan.me
  rules:
    - backendRefs:
        - name: slskd
          port: 5030

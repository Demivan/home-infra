apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slskd-secrets
  namespace: lidarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: slskd-secrets
  data:
    - secretKey: soulseek-username
      remoteRef:
        key: soulseek-username
    - secretKey: soulseek-password
      remoteRef:
        key: soulseek-password
    - secretKey: web-username
      remoteRef:
        key: slskd-web-username
    - secretKey: web-password
      remoteRef:
        key: slskd-web-password
    - secretKey: api-key
      remoteRef:
        key: slskd-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lidarr-secrets
  namespace: lidarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: lidarr-secrets
  data:
    - secretKey: api-key
      remoteRef:
        key: lidarr-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: soularr-config
  namespace: lidarr
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: soularr-config
    template:
      data:
        config.ini: |
          [Lidarr]
          api_key = {{ .lidarrApiKey }}
          host_url = http://lidarr:8686
          download_dir = /downloads
          disable_sync = False

          [Slskd]
          api_key = {{ .slskdApiKey }}
          host_url = http://slskd:5030
          url_base = /
          download_dir = /downloads
          delete_searches = False
          stalled_timeout = 3600
          remote_queue_timeout = 300

          [Release Settings]
          use_selected_lidarr_release = False
          use_most_common_tracknum = True
          allow_multi_disc = True
          accepted_countries = Europe,Japan,United Kingdom,United States,[Worldwide],Australia,Canada
          skip_region_check = False
          accepted_formats = CD,Digital Media,Vinyl

          [Search Settings]
          search_timeout = 5000
          maximum_peer_queue = 50
          minimum_peer_upload_speed = 0
          minimum_filename_match_ratio = 0.8
          minimum_search_interval = 5
          allowed_filetypes = flac 24/192,flac 16/44.1,flac,mp3 320,mp3
          ignored_users =
          album_prepend_artist = False
          search_type = incrementing_page
          number_of_albums_to_grab = 10
          title_blacklist =
          search_blacklist =
          search_source = missing
          failed_import_denylist = True

          [Download Settings]
          download_filtering = True
          use_extension_whitelist = False
          extensions_whitelist = lrc,nfo,txt

          [Logging]
          level = INFO
          format = [%(levelname)s|%(module)s|L%(lineno)d] %(asctime)s: %(message)s
          datefmt = %Y-%m-%dT%H:%M:%S%z
          log_to_file = True
          log_file = soularr.log
          max_bytes = 1048576
          backup_count = 3
  data:
    - secretKey: lidarrApiKey
      remoteRef:
        key: lidarr-api-key
    - secretKey: slskdApiKey
      remoteRef:
        key: slskd-api-key

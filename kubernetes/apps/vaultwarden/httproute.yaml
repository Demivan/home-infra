apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vaultwarden
  namespace: vaultwarden
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Vaultwarden
    gethomepage.dev/description: Passwords
    gethomepage.dev/group: Apps
    gethomepage.dev/weight: "20"
    gethomepage.dev/icon: sh-vaultwarden.svg
    gethomepage.dev/pod-selector: app.kubernetes.io/name=vaultwarden
    gethomepage.dev/siteMonitor: http://vaultwarden.vaultwarden.svc/alive
spec:
  parentRefs:
    - name: internal
      namespace: cilium-gateway
  hostnames:
    - vault.home.demivan.me
  rules:
    - backendRefs:
        - name: vaultwarden
          port: 80

# The node's public IPv4, which the stalwart-mail LoadBalancer and the public
# Gateway receive from Cilium node IPAM. Stalwart publishes every other mail
# record itself and points them at this name.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: stalwart
  namespace: stalwart
spec:
  endpoints:
    - dnsName: mail.demivan.me
      recordType: A
      recordTTL: 3600
      targets:
        - 46.224.162.75

# The node's public IPv4, which the stalwart-mail LoadBalancer receives from
# Cilium node IPAM. external-dns reads only Gateway routes and DNSEndpoints, so
# the mail host is published from here. The mta-sts hosts come from their
# HTTPRoute on the public gateway.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: stalwart
  namespace: stalwart
spec:
  endpoints:
    - dnsName: mail.demivan.me
      recordType: A
      recordTTL: 3600
      targets:
        - 46.224.162.75

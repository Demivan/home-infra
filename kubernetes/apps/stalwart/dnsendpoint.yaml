# The node's public IPv4. Mail traffic reaches the pods through hostPorts, so
# there is no Service address for external-dns to read; the IP is pinned here.
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: stalwart
  namespace: stalwart
spec:
  endpoints:
    - dnsName: mail.demivan.me
      recordType: A
      recordTTL: 3600
      targets:
        - 46.224.162.75
    - dnsName: mta-sts.demivan.me
      recordType: A
      recordTTL: 3600
      targets:
        - 46.224.162.75
    - dnsName: mta-sts.lab.demivan.me
      recordType: A
      recordTTL: 3600
      targets:
        - 46.224.162.75

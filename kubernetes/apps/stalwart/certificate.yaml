apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: mail-demivan-me
  namespace: stalwart
spec:
  secretName: stalwart-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - mail.demivan.me
  # Keeps the public key stable across renewals so a `3 1 1` TLSA record
  # (DANE) stays valid without a DNS change per renewal.
  privateKey:
    rotationPolicy: Never

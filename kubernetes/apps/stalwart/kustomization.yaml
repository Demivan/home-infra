apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - externalsecret.yaml
  - certificate.yaml
  - pvc-data.yaml
  - deployment.yaml
  - service.yaml
  - httproute.yaml
  - job-apply.yaml
  - cronjob-reload-tls.yaml
  - mta-sts.yaml
  - dnsendpoint.yaml
  - schedule.yaml

# Bootstrap phase: drop this once the postmaster API key is in Infisical
# (RUNBOOK.md, "First deployment").
components:
  - recovery

configMapGenerator:
  # Only the datastore lives on disk; everything else is in plan.ndjson.
  - name: stalwart-config
    namespace: stalwart
    files:
      - config/config.json
  - name: stalwart-plan
    namespace: stalwart
    files:
      - config/plan.ndjson
  - name: mta-sts-nginx
    namespace: stalwart
    files:
      - config/mta-sts.conf
  - name: mta-sts-policy
    namespace: stalwart
    files:
      - config/mta-sts.txt

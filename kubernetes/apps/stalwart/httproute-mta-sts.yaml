# The only path Stalwart exposes publicly: the MTA-STS policy it generates from
# the MtaSts object in plan.ndjson. Everything else on these hosts is a 404 at
# the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mta-sts
  namespace: stalwart
  annotations:
    # Stalwart publishes mta-sts.<domain> as a CNAME to mail.demivan.me; an
    # external-dns A record at the same name would conflict with it.
    external-dns.kubernetes.io/controller: stalwart
spec:
  parentRefs:
    - name: public
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - mta-sts.lab.demivan.me
    - mta-sts.demivan.me
  rules:
    - matches:
        - path:
            type: Exact
            value: /.well-known/mta-sts.txt
      backendRefs:
        - name: stalwart
          port: 8080

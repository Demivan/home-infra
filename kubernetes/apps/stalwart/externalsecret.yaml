apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-dkim
  namespace: stalwart
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: stalwart-dkim
  # One Infisical key per selector, so a rotation adds keys instead of
  # overwriting the ones still published in DNS.
  data:
    - secretKey: s2026a-rsa.pem
      remoteRef:
        key: stalwart-dkim-s2026a-rsa
    - secretKey: s2026a-ed25519.pem
      remoteRef:
        key: stalwart-dkim-s2026a-ed25519
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-relay
  namespace: stalwart
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: stalwart-relay
  data:
    - secretKey: password
      remoteRef:
        key: stalwart-relay-password
---
# API key of the postmaster admin account, used by the plan-apply Job and the
# certificate-reload CronJob. Created by hand after bootstrap (see RUNBOOK.md);
# the recovery component removes this ExternalSecret until it exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-api
  namespace: stalwart
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: stalwart-api
  data:
    - secretKey: token
      remoteRef:
        key: stalwart-api-token

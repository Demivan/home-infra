apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-cloudflare
  namespace: stalwart
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: stalwart-cloudflare
  # Same token as cert-manager and external-dns: Stalwart publishes and rotates
  # its own mail records (MX, SPF, DKIM, DMARC, MTA-STS, TLS-RPT, SRV) in demivan.me.
  data:
    - secretKey: api-token
      remoteRef:
        key: cloudflare-api-token
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-relay
  namespace: stalwart
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: stalwart-relay
  data:
    - secretKey: password
      remoteRef:
        key: stalwart-relay-password
---
# API key of the postmaster admin account, used by the plan-apply Job and the
# certificate-reload CronJob. Created by hand after bootstrap (see RUNBOOK.md);
# the recovery component removes this ExternalSecret until it exists.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stalwart-api
  namespace: stalwart
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: stalwart-api
  data:
    - secretKey: token
      remoteRef:
        key: stalwart-api-token

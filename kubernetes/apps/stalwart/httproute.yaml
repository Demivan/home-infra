apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: stalwart
  namespace: stalwart
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Stalwart
    gethomepage.dev/description: Mail
    gethomepage.dev/group: Apps
    gethomepage.dev/weight: "30"
    gethomepage.dev/icon: sh-stalwart.svg
    gethomepage.dev/pod-selector: app=stalwart
    gethomepage.dev/siteMonitor: http://stalwart.stalwart.svc:8080/healthz/live
spec:
  parentRefs:
    - name: internal
      namespace: cilium-gateway
  hostnames:
    - mail.home.demivan.me
  rules:
    - backendRefs:
        - name: stalwart
          port: 8080

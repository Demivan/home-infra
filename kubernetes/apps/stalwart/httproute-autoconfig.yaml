# Thunderbird account autoconfiguration (IMAP/SMTP settings for an address).
# Everything else on this host is a 404 at the gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: autoconfig
  namespace: stalwart
  annotations:
    # Stalwart publishes autoconfig.<domain> as a CNAME to mail.demivan.me; an
    # external-dns A record at the same name would conflict with it.
    external-dns.kubernetes.io/controller: stalwart
spec:
  parentRefs:
    - name: public
      namespace: cilium-gateway
      sectionName: https
  hostnames:
    - autoconfig.demivan.me
  rules:
    - matches:
        - path:
            type: Exact
            value: /mail/config-v1.1.xml
      backendRefs:
        - name: stalwart
          port: 8080

# Public mail ports on the node IP (Cilium node IPAM; Hetzner firewall rules in
# terraform/main.tf). `Local` keeps the client source IP, which SPF, DNSBL
# checks and rate limiting depend on.
apiVersion: v1
kind: Service
metadata:
  name: stalwart-mail
  namespace: stalwart
spec:
  type: LoadBalancer
  loadBalancerClass: io.cilium/node
  externalTrafficPolicy: Local
  allocateLoadBalancerNodePorts: false
  selector:
    app: stalwart
  ports:
    - name: smtp
      port: 25
      targetPort: smtp
    - name: submissions
      port: 465
      targetPort: submissions
    - name: submission
      port: 587
      targetPort: submission
    - name: imaps
      port: 993
      targetPort: imaps

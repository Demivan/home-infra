apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: adventurelog-secrets
  namespace: adventurelog
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: adventurelog-secrets
  data:
    - secretKey: db-password
      remoteRef:
        key: adventurelog-db-password
    # Django SECRET_KEY. Must be stable — the AIO entrypoint generates a random
    # one when unset, which would invalidate every session on each restart.
    - secretKey: secret-key
      remoteRef:
        key: adventurelog-secret-key
    - secretKey: admin-password
      remoteRef:
        key: adventurelog-admin-password

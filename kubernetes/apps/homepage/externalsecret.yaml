apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage-secrets
  namespace: homepage
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: homepage-secrets
  data:
    - secretKey: auth-secret
      remoteRef:
        key: homepage-auth-secret
    - secretKey: oidc-client-id
      remoteRef:
        key: homepage-oidc-client-id
    - secretKey: oidc-client-secret
      remoteRef:
        key: homepage-oidc-client-secret
    # Widget credentials, exposed to the pod as HOMEPAGE_VAR_* and referenced
    # from the `gethomepage.dev/widget.*` annotations on each app's HTTPRoute.
    - secretKey: immich-api-key
      remoteRef:
        key: homepage-immich-api-key
    - secretKey: lidarr-api-key
      remoteRef:
        key: lidarr-api-key
    - secretKey: slskd-api-key
      remoteRef:
        key: slskd-api-key
    - secretKey: navidrome-user
      remoteRef:
        key: homepage-navidrome-user
    - secretKey: navidrome-token
      remoteRef:
        key: homepage-navidrome-token
    - secretKey: navidrome-salt
      remoteRef:
        key: homepage-navidrome-salt
    - secretKey: authentik-token
      remoteRef:
        key: homepage-authentik-token
    - secretKey: argocd-token
      remoteRef:
        key: homepage-argocd-token

apiVersion: apps/v1
kind: Deployment
metadata:
  name: homepage
  namespace: homepage
spec:
  replicas: 1
  selector:
    matchLabels:
      app: homepage
  template:
    metadata:
      labels:
        app: homepage
    spec:
      priorityClassName: app-default
      serviceAccountName: homepage
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: homepage
          image: ghcr.io/gethomepage/homepage:v2.6.0
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            # Requests whose Host isn't listed are rejected; the pod IP entry
            # is what the kubelet probes send.
            - name: HOMEPAGE_ALLOWED_HOSTS
              value: "$(POD_IP):3000,home.demivan.me"
            - name: HOMEPAGE_AUTH_ENABLED
              value: "true"
            - name: HOMEPAGE_EXTERNAL_URL
              value: https://home.demivan.me
            - name: HOMEPAGE_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: auth-secret
            - name: HOMEPAGE_OIDC_NAME
              value: Authentik
            - name: HOMEPAGE_OIDC_ISSUER
              value: https://auth.home.demivan.me/application/o/homepage/
            - name: HOMEPAGE_OIDC_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: oidc-client-id
            - name: HOMEPAGE_OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: oidc-client-secret
            - name: HOMEPAGE_OIDC_AUTO_LOGIN
              value: "true"
            # Substituted into the widget annotations of discovered HTTPRoutes.
            - name: HOMEPAGE_VAR_IMMICH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: immich-api-key
            - name: HOMEPAGE_VAR_LIDARR_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: lidarr-api-key
            - name: HOMEPAGE_VAR_SLSKD_API_KEY
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: slskd-api-key
            - name: HOMEPAGE_VAR_NAVIDROME_USER
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: navidrome-user
            - name: HOMEPAGE_VAR_NAVIDROME_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: navidrome-token
            - name: HOMEPAGE_VAR_NAVIDROME_SALT
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: navidrome-salt
            - name: HOMEPAGE_VAR_AUTHENTIK_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: authentik-token
            - name: HOMEPAGE_VAR_ARGOCD_TOKEN
              valueFrom:
                secretKeyRef:
                  name: homepage-secrets
                  key: argocd-token
          volumeMounts:
            # Homepage copies skeleton files for any config it doesn't find,
            # so the directory itself must be writable.
            - name: config
              mountPath: /app/config
            - name: homepage-config
              mountPath: /app/config/settings.yaml
              subPath: settings.yaml
            - name: homepage-config
              mountPath: /app/config/kubernetes.yaml
              subPath: kubernetes.yaml
            - name: homepage-config
              mountPath: /app/config/services.yaml
              subPath: services.yaml
            - name: homepage-config
              mountPath: /app/config/widgets.yaml
              subPath: widgets.yaml
            - name: homepage-config
              mountPath: /app/config/bookmarks.yaml
              subPath: bookmarks.yaml
          readinessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/healthcheck
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 384Mi
      volumes:
        - name: config
          emptyDir: {}
        - name: homepage-config
          configMap:
            name: homepage-config

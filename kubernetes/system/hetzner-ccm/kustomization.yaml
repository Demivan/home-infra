apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: hcloud-cloud-controller-manager
    repo: https://charts.hetzner.cloud
    version: "1.36.0"
    releaseName: hcloud-cloud-controller-manager
    namespace: kube-system
    valuesInline:
      networking:
        enabled: true
        clusterCIDR: "10.0.16.0/20"
      priorityClassName: infra-critical
      # Single replica binding a hostPort on a single-node cluster: the default
      # rolling update rounds maxSurge up to 1 and maxUnavailable down to 0, so
      # the new pod waits forever for a port the old pod still holds.
      strategy:
        type: Recreate

resources:
  - externalsecret.yaml

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - name: k8up
    repo: https://k8up-io.github.io/k8up
    version: "4.9.0"
    releaseName: k8up
    namespace: k8up
    includeCRDs: true
    valuesInline:
      k8up:
        skipWithoutAnnotation: false
      metrics:
        serviceMonitor:
          enabled: false
      resources:
        requests:
          cpu: 20m
          memory: 128Mi
        limits:
          memory: 256Mi

resources:
  - clusterexternalsecret.yaml

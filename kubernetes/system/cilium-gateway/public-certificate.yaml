apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: public-gateway
  namespace: cilium-gateway
spec:
  secretName: public-gateway-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - mta-sts.demivan.me
    - autoconfig.demivan.me
    # No route serves it; mail clients probe https:// on their IMAP host after
    # account setup and warn on a name mismatch rather than a 404.
    - mail.demivan.me

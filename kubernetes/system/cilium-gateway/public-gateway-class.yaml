apiVersion: cilium.io/v2alpha1
kind: CiliumGatewayClassConfig
metadata:
  name: cilium-public
spec:
  service:
    type: LoadBalancer
    loadBalancerClass: io.cilium/node
    # Must stay Cluster: Cilium backs Gateway Services with a placeholder
    # endpoint that has no nodeName, and Node IPAM under Local picks nodes from
    # EndpointSlice nodeNames, so Local leaves the Service without an address.
    externalTrafficPolicy: Cluster
    allocateLoadBalancerNodePorts: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: cilium-public
spec:
  controllerName: io.cilium/gateway-controller
  parametersRef:
    group: cilium.io
    kind: CiliumGatewayClassConfig
    name: cilium-public
    namespace: cilium-gateway

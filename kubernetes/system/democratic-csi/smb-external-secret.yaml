apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: democratic-csi-smb-credentials
  namespace: democratic-csi
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: democratic-csi-smb-credentials
    template:
      engineVersion: v2
      data:
        # democratic-csi smb-client expects mount_flags as a single comma-separated string
        mount_flags: "username={{ .username }},password={{ .password }}"
        # Also store individual values for the controller postStart mount
        username: "{{ .username }}"
        password: "{{ .password }}"
  data:
    - secretKey: username
      remoteRef:
        key: storagebox-username
    - secretKey: password
      remoteRef:
        key: storagebox-password

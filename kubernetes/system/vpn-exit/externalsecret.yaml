apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-common
  namespace: vpn-exit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: vpn-common
    template:
      data:
        VPN_SERVICE_PROVIDER: "{{ .provider }}"
        HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"apikey","apikey":"{{ .controlApiKey }}"}'
  data:
    - secretKey: provider
      remoteRef:
        key: vpn-provider
    - secretKey: controlApiKey
      remoteRef:
        key: vpn-control-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vpn-credentials-ukraine
  namespace: vpn-exit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: vpn-credentials-ukraine
    template:
      data:
        WIREGUARD_PRIVATE_KEY: "{{ .privateKey }}"
        WIREGUARD_ADDRESSES: "{{ .addresses }}"
  data:
    - secretKey: privateKey
      remoteRef:
        key: vpn-wireguard-private-key-ukraine
    - secretKey: addresses
      remoteRef:
        key: vpn-wireguard-addresses-ukraine

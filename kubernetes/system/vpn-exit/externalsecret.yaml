apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-oauth
  namespace: vpn-exit
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: infisical
  target:
    name: tailscale-oauth
    # Keys minted from a client secret are ephemeral unless told otherwise, and
    # control deletes ephemeral nodes while they are offline. The pod's state
    # Secret then pins the deleted identity and tailscaled never logs in again.
    template:
      data:
        client_id: "{{ .client_id }}"
        client_secret: "{{ .client_secret }}?ephemeral=false"
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale-client-id
    - secretKey: client_secret
      remoteRef:
        key: tailscale-client-secret

apiVersion: v1
kind: ServiceAccount
metadata:
  name: vpn-exit
  namespace: vpn-exit
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: vpn-exit
  namespace: vpn-exit
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: vpn-exit
  namespace: vpn-exit
subjects:
  - kind: ServiceAccount
    name: vpn-exit
roleRef:
  kind: Role
  name: vpn-exit
  apiGroup: rbac.authorization.k8s.io

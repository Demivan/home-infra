apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -germany

labels:
  - pairs:
      location: germany
    includeSelectors: true

configMapGenerator:
  - name: vpn-location
    namespace: vpn-exit
    literals:
      - SERVER_COUNTRIES=Germany
      - TS_HOSTNAME=vpn-exit-germany

patches:
  - path: credentials.yaml

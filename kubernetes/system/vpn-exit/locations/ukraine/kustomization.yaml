apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -ukraine

labels:
  - pairs:
      location: ukraine
    includeSelectors: true

configMapGenerator:
  - name: vpn-location
    namespace: vpn-exit
    literals:
      - SERVER_COUNTRIES=Ukraine
      - TS_HOSTNAME=vpn-exit-ukraine

patches:
  - path: credentials.yaml

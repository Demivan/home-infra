apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: vpn-exit
  namespace: vpn-exit
spec:
  template:
    spec:
      initContainers:
        - name: netprep
        - name: gluetun
          envFrom:
            - secretRef:
                name: vpn-common
            - secretRef:
                name: vpn-credentials-ukraine

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

nameSuffix: -switzerland

labels:
  - pairs:
      location: switzerland
    includeSelectors: true

configMapGenerator:
  - name: vpn-location
    namespace: vpn-exit
    literals:
      - SERVER_COUNTRIES=Switzerland
      - TS_HOSTNAME=vpn-exit-switzerland

patches:
  - path: credentials.yaml

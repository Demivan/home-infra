apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd
  namespace: argocd
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Argo CD
    gethomepage.dev/description: GitOps
    gethomepage.dev/group: Platform
    gethomepage.dev/weight: "30"
    gethomepage.dev/icon: sh-argo-cd.svg
    gethomepage.dev/pod-selector: app.kubernetes.io/part-of=argocd
    gethomepage.dev/siteMonitor: http://argocd-server.argocd.svc/healthz
    gethomepage.dev/widget.type: argocd
    gethomepage.dev/widget.url: http://argocd-server.argocd.svc
    gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_ARGOCD_TOKEN}}"
spec:
  parentRefs:
    - name: internal
      namespace: cilium-gateway
  hostnames:
    - argocd.home.demivan.me
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80
